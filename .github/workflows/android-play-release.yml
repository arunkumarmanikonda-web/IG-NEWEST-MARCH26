name: Android Play release bundle

# Builds a signed AAB only. Upload and Play rollout are separate, deliberate actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-play-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: mobile

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Configure main-only deployment branches and required reviewers in GitHub.
    # Merely naming an environment here does not create those protections.
    environment: android-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Validate source and signing guards
        run: |
          npm run check
          npm run test:release
          npm audit --omit=dev --audit-level=high
      - name: Generate clean Android project
        run: |
          npx expo prebuild --clean --platform android --no-install
          npx expo config --type public --json > android/play-release-config.json
      - name: Build and verify with the approved upload key
        env:
          ANDROID_UPLOAD_SIGNING_BUNDLE: ${{ secrets.ANDROID_UPLOAD_SIGNING_BUNDLE }}
          ANDROID_UPLOAD_CERTIFICATE_SHA256: ${{ vars.ANDROID_UPLOAD_CERTIFICATE_SHA256 }}
        run: node scripts/android-play-release.mjs
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/india-gully-play-signing"
      - name: Audit final signed AAB manifest
        shell: bash
        run: |
          set -euo pipefail
          tool_path="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' \
            --output "$tool_path"
          printf '%s  %s\n' \
            'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' \
            "$tool_path" | sha256sum --check --strict
          PYTHONDONTWRITEBYTECODE=1 python3 tests/android-manifest-audit.test.py
          python3 scripts/audit-android-bundle.py \
            --bundle release-output/india-gully-play.aab \
            --bundletool "$tool_path" \
            --config android/play-release-config.json \
            --release-manifest release-output/release-manifest.json \
            --output release-output
      - uses: actions/upload-artifact@v4
        with:
          name: india-gully-play-release-${{ github.sha }}
          path: |
            mobile/release-output/india-gully-play.aab
            mobile/release-output/upload-certificate.pem
            mobile/release-output/release-manifest.json
            mobile/release-output/android-manifest.xml
            mobile/release-output/android-manifest-audit.json
          if-no-files-found: error
          retention-days: 14
