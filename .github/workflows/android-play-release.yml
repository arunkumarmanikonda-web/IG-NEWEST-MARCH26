name: Android Play release bundle

# Builds a signed AAB only. Upload and Play rollout are separate, deliberate actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-play-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: mobile

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Configure main-only deployment branches and required reviewers in GitHub.
    # Merely naming an environment here does not create those protections.
    environment: android-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Validate source and signing guards
        run: |
          npm run check
          npm run test:release
          npm audit --omit=dev --audit-level=high
      - name: Generate clean Android project
        run: |
          npx expo prebuild --clean --platform android --no-install
          npx expo config --type public --json > android/play-release-config.json
      - name: Build and verify with the approved upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_CERTIFICATE_SHA256: ${{ vars.ANDROID_UPLOAD_CERTIFICATE_SHA256 }}
        run: node scripts/android-play-release.mjs
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/india-gully-play-signing"
      - uses: actions/upload-artifact@v4
        with:
          name: india-gully-play-release-${{ github.sha }}
          path: |
            mobile/release-output/india-gully-play.aab
            mobile/release-output/upload-certificate.pem
            mobile/release-output/release-manifest.json
          if-no-files-found: error
          retention-days: 14
