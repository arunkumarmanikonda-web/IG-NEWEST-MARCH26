name: Mobile app builds

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'lib/mobile-catalogue.mjs'
      - 'lib/residences.mjs'
      - 'app/api/mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'lib/mobile-catalogue.mjs'
      - 'lib/residences.mjs'
      - 'app/api/mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  validate:
    name: Validate mobile app
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Bundle Android, iOS and browser preview
        run: npm run export

  android:
    name: Android standalone test APK
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      # The Expo template's release variant embeds the JavaScript bundle and
      # uses its development keystore. This is an installable test build, not
      # a Play Store release. Production signing is configured separately.
      - name: Compile standalone APK with test signing
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Verify bundled application
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('android/app/build/outputs/apk/release/app-release.apk') as apk:
              assert apk.getinfo('assets/index.android.bundle').file_size > 0, 'Missing embedded JavaScript bundle'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: india-gully-android-test-debug-signed-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS unsigned simulator app
    needs: validate
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Select compatible Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
      - run: npm ci
      # A Release simulator build embeds JavaScript and needs neither an
      # Expo account nor Apple signing credentials. It cannot run on iPhones.
      - name: Compile simulator application
        run: npx expo run:ios --configuration Release --device generic --output ./build --no-bundler
      - name: Package simulator application
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          apps = list(Path('build').glob('*.app'))
          if len(apps) != 1:
              raise SystemExit(f'Expected one simulator application, found {len(apps)}')
          bundle = apps[0] / 'main.jsbundle'
          if not bundle.is_file() or bundle.stat().st_size == 0:
              raise SystemExit('Missing embedded JavaScript bundle')
          subprocess.run(['ditto', '-c', '-k', '--sequesterRsrc', '--keepParent', str(apps[0]), 'india-gully-ios-simulator.zip'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: india-gully-ios-unsigned-simulator-app
          path: mobile/india-gully-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
